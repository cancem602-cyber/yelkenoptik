<title>Yelken Optik | IBAN</title>
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; background:#000; color:#fff; font-family:Poppins,Arial,Helvetica,sans-serif; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; position:relative; overflow:hidden; }
  .ring { position:absolute; border-radius:50%; border:1px solid rgba(255,255,255,.09); pointer-events:none; }
  .r1 { width:360px; height:360px; top:-150px; left:-140px; }
  .r2 { width:250px; height:250px; top:-95px; left:-85px; }
  .r3 { width:420px; height:420px; bottom:-190px; right:-170px; }
  .r4 { width:290px; height:290px; bottom:-125px; right:-105px; }
  .r5 { width:150px; height:150px; bottom:-45px; right:-35px; background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.07),transparent 65%); }
  main { position:relative; z-index:1; width:100%; max-width:420px; text-align:center; }
  .logo { width:100%; display:block; margin:0 0 6px; }
  .divider { display:flex; align-items:center; gap:14px; margin:6px 0 22px; color:#d9d9d9; }
  .divider::before,.divider::after { content:""; flex:1; height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.45)); }
  .divider::after { background:linear-gradient(270deg,transparent,rgba(255,255,255,.45)); }
  .glasses { width:74px; height:auto; }
  h1 { font-size:14px; font-weight:500; letter-spacing:7px; text-transform:uppercase; margin:0 0 18px; color:#e8e8e8; }
  .card { background:linear-gradient(160deg,#1a1a1a 0%,#0c0c0c 100%); border:1px solid rgba(255,255,255,.28); border-radius:24px; padding:24px 20px; text-align:left; box-shadow:0 0 0 6px rgba(255,255,255,.03),0 18px 40px rgba(0,0,0,.6); }
  .label { font-size:11px; color:#9a9a9a; text-transform:uppercase; letter-spacing:2px; margin:0 0 4px; }
  .value { font-size:17px; font-weight:600; margin:0 0 16px; padding-bottom:16px; border-bottom:1px solid rgba(255,255,255,.12); }
  .iban { font-size:19px; font-weight:700; letter-spacing:1.5px; word-break:break-word; margin:0; color:#fff; }
  button { width:100%; margin-top:22px; padding:16px; border:0; border-radius:999px; background:#fff; color:#000; font-size:16px; font-weight:700; letter-spacing:.5px; font-family:inherit; cursor:pointer; }
  button:active { transform:scale(.98); }
  .note { font-size:13px; color:#a8a8a8; margin-top:16px; }
  .brand { margin-top:22px; font-size:10px; letter-spacing:5px; color:#6f6f6f; text-transform:uppercase; }
</style>
</head>
